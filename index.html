/* Layout: the clear-acrylic two-row panel at true scale (6 px = 1 mm), scaled to fit the screen, with a slim monitor strip above it */
:root {
  --ground: #17161b;
  --etch: #e8e3ef;
  --etch-dim: #8f899c;
  --cream: #f3eee2;
  --ink: #141318;
  --lcd: #0c0e0d;
  --lcd-on: #b6ff5c;
  --lcd-dim: #26301f;
  --blackletter: 'UnifrakturMaguntia', 'Pirata One', 'Old English Text MT', serif;
  --label: 'Pirata One', 'UnifrakturMaguntia', serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--ground); color: var(--etch); }
body { font-family: var(--label); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 36px; }
.wrap { max-width: 948px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.monitor { background: var(--lcd); color: var(--lcd-on); border: 1px solid #000; border-radius: 10px; padding: 10px 14px; display: grid; gap: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mon-row { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 13px; min-width: 0; }
.mon-row b { font-weight: 600; }
.mon-sub { font-size: 12px; color: #8fcf4a; min-height: 1.4em; }
.steps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.step { height: 6px; border-radius: 2px; background: var(--lcd-dim); }
.step.beat { height: 10px; margin-top: -2px; }
.step.on { background: var(--lcd-on); box-shadow: 0 0 8px var(--lcd-on); }

.stage { position: relative; width: 100%; }
.panel-box { position: absolute; left: 0; top: 0; width: 728px; height: 810px; transform-origin: top left; }
.panel {
  position: relative; width: 728px; height: 810px; box-sizing: border-box; padding: 24px 36px 28px;
  border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; gap: 16px;
  background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04) 55%, rgba(255,255,255,.09));
  border: 3px solid rgba(255,255,255,.32); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 24px 48px rgba(0,0,0,.55);
}
.pcb { position: absolute; inset: 0; opacity: .3; pointer-events: none; }
.pcb div { position: absolute; }
.panel > :not(.pcb) { position: relative; }
.head { display: flex; align-items: center; justify-content: space-between; }
.brand { font-family: var(--blackletter); font-size: 52px; line-height: 1; color: var(--cream); white-space: nowrap; margin: 0; font-weight: 400; }
.jacks { display: flex; gap: 26px; align-items: flex-end; }
.jack { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 20px; line-height: 1; }
.jack i { width: 54px; height: 54px; border-radius: 50%; box-sizing: border-box; border: 6px solid #c9c5d0; background: #08080a; display: grid; place-items: center; }
.jack i::after { content: ''; width: 21px; height: 21px; border-radius: 50%; background: #2b2a31; }

.krow { display: flex; justify-content: space-between; padding: 0 6px; }
.kcell { width: 156px; display: flex; flex-direction: column; align-items: center; }
.dial { position: relative; width: 156px; height: 156px; touch-action: none; cursor: ns-resize; border-radius: 50%; }
.tw { position: absolute; inset: 0; pointer-events: none; }
.tb { position: absolute; left: 50%; border-radius: 1px; }
.tl { position: absolute; transform: translate(-50%, -50%); color: var(--etch); white-space: nowrap; line-height: 1; pointer-events: none; }
.cap { position: absolute; left: 39px; top: 39px; width: 78px; height: 78px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4f2f7, #a6a2ae 72%); box-shadow: 0 5px 12px rgba(0,0,0,.6); pointer-events: none; }
.cap .ptr { position: absolute; inset: 0; transform: rotate(var(--rot, 0deg)); }
.cap .ptr::after { content: ''; position: absolute; left: 50%; top: 5px; width: 5px; height: 24px; margin-left: -2.5px; border-radius: 3px; background: var(--ink); }
.kval { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--etch-dim); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.kname { font-size: 22px; line-height: 1; }

.rule { height: 2px; background: rgba(232,227,239,.5); border-radius: 1px; }
.brow { display: flex; justify-content: space-between; }
.bcell { width: 108px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.blbl { font-size: 20px; line-height: 1; margin-top: 2px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.latch { width: 72px; height: 72px; border-radius: 10px; border: 2px solid #08080a; background: var(--cream); box-shadow: 0 5px 0 #6d6878; transition: transform .05s, box-shadow .05s, background .05s; }
.latch[aria-pressed="true"] { background: #cfc9bd; box-shadow: 0 1px 0 #6d6878; transform: translateY(4px); }
.round { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #c9c5d0; background: #2c2b33; box-shadow: 0 5px 0 #08080a; transition: transform .05s, box-shadow .05s; touch-action: none; user-select: none; }
.round.play { border-color: #08080a; background: var(--cream); box-shadow: 0 5px 0 #6d6878; }
.round.play.playing { box-shadow: 0 5px 0 #6d6878, 0 0 0 4px rgba(243,238,226,.25); }
.round.stutter { border-color: #08080a; background: #121116; }
.round.roll { border-color: #08080a; background: #ffffff; box-shadow: 0 5px 0 #6d6878; }
.round:active, .round.down { transform: translateY(4px); box-shadow: 0 1px 0 #08080a; }
:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }

.help { color: #b4aec0; font-family: var(--mono); font-size: 12px; line-height: 1.6; max-width: 75ch; }
.help kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border: 1px solid #4a4752; border-radius: 4px; color: var(--cream); }
/* ---- app shell (iPhone) ---- */
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body { box-sizing: border-box; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.wrap { height: 100%; max-width: none; gap: 10px; }
.stage { flex: 1; min-height: 0; }
.panel { touch-action: none; }
.panel-box { will-change: transform; }
@media (orientation: landscape) and (max-height: 600px) {
  .wrap { flex-direction: row; }
  .monitor { width: 200px; flex: none; align-content: start; }
  .mon-row { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { .latch, .round { transition: none; } .step.on { box-shadow: none; } }

    var drag = false, y0 = 0, v0 = 0;
    el.addEventListener('pointerdown', function (e) { drag = true; y0 = e.clientY; v0 = v; el.setPointerCapture(e.pointerId); if (e.pointerType !== 'touch') el.focus(); e.preventDefault(); });
    el.addEventListener('pointermove', function (e) { if (drag) apply(v0 + (y0 - e.clientY) / Math.max(180 * panelScale, 240)); });
    el.addEventListener('pointerup', function () { drag = false; });
    el.addEventListener('pointercancel', function () { drag = false; });
    el.addEventListener('wheel', function (e) { e.preventDefault(); var st = K.steps ? 1 / K.steps : 0.02; apply((K.steps ? shown() : v) - Math.sign(e.deltaY) * st); }, { passive: false });
    el.addEventListener('keydown', function (e) {
      var st = K.steps ? 1 / K.steps : 0.02, base = K.steps ? shown() : v;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { apply(base + st); e.preventDefault(); e.stopPropagation(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { apply(base - st); e.preventDefault(); e.stopPropagation(); }
    });
    K.set(v, zone()); paint();
  });

  // ---------------- fit the true-scale panel to the screen ----------------
  var panelScale = 1;
  function fitPanel() {
    var stage = document.getElementById('stage'), box = document.getElementById('panel-box');
    panelScale = Math.min(1.3, stage.clientWidth / 728, stage.clientHeight / 810);
    box.style.transform = 'scale(' + panelScale + ')';
    box.style.left = Math.max(0, (stage.clientWidth - 728 * panelScale) / 2) + 'px';
    box.style.top = Math.max(0, (stage.clientHeight - 810 * panelScale) / 2) + 'px';
  }
  fitPanel();
  window.addEventListener('resize', fitPanel);
  window.addEventListener('orientationchange', function () { setTimeout(fitPanel, 300); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPanel);

  // ---------------- buttons ----------------
  function tap(el, fn, flashIt) {
    var lastDown = 0;
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); lastDown = Date.now(); fn(); if (flashIt) flash(el.id); unlock(); });
    el.addEventListener('click', function (e) { if (Date.now() - lastDown > 1000) fn(); });   // keyboard Enter/Space only; touches already fired
  }
  var MUTE_NAMES = ['Kick', 'Shaker', 'Clave', 'Bass', 'Organ', 'Lead'];
  var muteWrap = document.getElementById('mutes'), muteBtns = [];
  MUTE_NAMES.forEach(function (n, i) {
    var cell = document.createElement('div'); cell.className = 'bcell';
    cell.innerHTML = '<button class="latch" id="m-' + i + '" aria-pressed="false" aria-label="Mute ' + n.toLowerCase() + '"></button><div class="blbl">' + n + '</div>';
    muteWrap.appendChild(cell);
    var b = cell.querySelector('button'); muteBtns.push(b);
    tap(b, function () { toggleMute(i); });
  });
  function toggleMute(i) { S.muted[i] = !S.muted[i]; muteBtns[i].setAttribute('aria-pressed', String(S.muted[i])); if (i === 5 && S.muted[i] && lead) lead.noteOff(); }
  tap(document.getElementById('b-play'), togglePlay, true);
  tap(document.getElementById('b-chords'), newChords, true);
  tap(document.getElementById('b-organ'), newOrgan, true);
  tap(document.getElementById('b-lead'), newLead, true);

  function releaseGlitch() { if (!S.stutterHeld && !S.rollHeld && glitch) glitch.stop(); }
  function holdButton(id, flag) {
    var b = document.getElementById(id);
    function down() { b.classList.add('down'); if (!ctx) return; S[flag] = true; }
    function up() { S[flag] = false; b.classList.remove('down'); releaseGlitch(); }
    b.addEventListener('pointerdown', function (e) { b.setPointerCapture(e.pointerId); down(); e.preventDefault(); unlock(); });
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    b.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { down(); e.preventDefault(); } });
    b.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') { up(); e.preventDefault(); } });
    return { down: down, up: up };
  }
  var stutterBtn = holdButton('b-stutter', 'stutterHeld'), rollBtn = holdButton('b-roll', 'rollHeld');

  function flash(id) { var b = document.getElementById(id); b.classList.add('down'); setTimeout(function () { b.classList.remove('down'); }, 120); }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    var k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); if (!e.repeat) { togglePlay(); flash('b-play'); } }
    else if (k >= '1' && k <= '6') { if (!e.repeat) toggleMute(+k - 1); }
    else if (k === 'g') { if (!e.repeat) stutterBtn.down(); }
    else if (k === 'r') { if (!e.repeat) rollBtn.down(); }
    else if (k === 'c') { if (!e.repeat) { newChords(); flash('b-chords'); } }
    else if (k === 'o') { if (!e.repeat) { newOrgan(); flash('b-organ'); } }
    else if (k === 'l') { if (!e.repeat) { newLead(); flash('b-lead'); } }
  });
  document.addEventListener('keyup', function (e) { var k = e.key.toLowerCase(); if (k === 'g') stutterBtn.up(); else if (k === 'r') rollBtn.up(); });

  // ---------------- monitor ----------------
  var stepsEl = document.getElementById('steps'), stepEls = [];
  for (var i = 0; i < 16; i++) { var d = document.createElement('div'); d.className = 'step' + (i % 4 === 0 ? ' beat' : ''); stepsEl.appendChild(d); stepEls.push(d); }
  var mState = document.getElementById('m-state'), mBpm = document.getElementById('m-bpm'), mKey = document.getElementById('m-key'),
      mChords = document.getElementById('m-chords'), mBar = document.getElementById('m-bar'), mSub = document.getElementById('m-sub');
  function setText(el, t) { if (el.textContent !== t) el.textContent = t; }
  function setSub(t) { setText(mSub, t); }
  var lastLit = -1;
  function frame() {
    setText(mState, S.playing ? '▶ PLAYING' : '■ STOPPED');
    setText(mBpm, Math.round(S.bpm) + ' BPM');
    setText(mKey, NOTE[S.keyRoot] + ' ' + MODE_NAMES[S.mode]);
    setText(mChords, H.names.join(' – '));
    setText(mBar, S.playing ? 'bar ' + ((S.bar % 4) + 1) + ' / 4' : '');
    var lit = S.playing ? S.lastStep : -1;
    if (lit !== lastLit) { if (lastLit >= 0) stepEls[lastLit].classList.remove('on'); if (lit >= 0) stepEls[lit].classList.add('on'); lastLit = lit; }
    var P = S.pending, q = [];
    if (P.organ) q.push('new organ'); if (P.lead) q.push('new lead');
    if (P.key >= 0) q.push('key of ' + NOTE[P.key]);
    if (P.clave >= 0) q.push('clave ' + (P.clave + 1));
    var fx = [];
    if (S.phaser) fx.push('phaser ' + Math.round(S.phaser * 100) + '%'); if (S.crush >= 0.01) fx.push('crush ' + Math.round(S.crush * 100) + '%');
    if (S.rollHeld) fx.push('ROLL'); else if (S.stutterHeld) fx.push('STUTTER');
    var info = 'clave: ' + CLAVE_NAMES[S.clave] + (fx.length ? ' · ' + fx.join(' · ') : '');
    var ph = [];
    if (P.chords) ph.push('new chords'); if (P.mode >= 0) ph.push(MODE_NAMES[P.mode] + ' mode');
    var parts = [];
    if (q.length) parts.push('Next bar: ' + q.join(', '));
    if (ph.length) parts.push('Next phrase: ' + ph.join(', '));
    if (parts.length) setSub(parts.join('  ·  ') + '  ·  ' + info);
    else if (S.playing || ctx) setSub(info);
    requestAnimationFrame(frame);
  }

  // ---------------- start ----------------
  applyKey(); generateLead(); generateOrgan();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
  requestAnimationFrame(frame);
})();
</script>
